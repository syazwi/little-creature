    /* Pixelify Sans (SIL Open Font License), bundled so the game works offline */
    @font-face { font-family: 'Pixelify Sans'; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url(lib/fonts/PixelifySans-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Pixelify Sans'; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url(lib/fonts/PixelifySans-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    html, body { margin: 0; height: 100%; background: #120d0a; overflow: hidden; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #game { width: 100%; height: 100%; touch-action: none; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #120d0a; color: #e8cf86;
      font-family: 'Pixelify Sans', monospace; font-size: 22px; text-align: center;
      flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    #rotate b { font-size: 56px; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    /* co-op lobby overlay */
    #lobby { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(10, 7, 18, 0.72);
      align-items: center; justify-content: center; font-family: 'Pixelify Sans', monospace; }
    #lobby.open { display: flex; }
    #lobby .card { width: min(94vw, 640px); max-height: 94vh; overflow: auto; box-sizing: border-box; padding: 14px 20px;
      background: #1e1510; border: 3px solid #d9a94e; border-radius: 10px; color: #fbecc8; box-shadow: 0 10px 40px #000a;
      -webkit-user-select: text; user-select: text; }
    #lobby h2 { margin: 0; color: #ffd166; font-size: 26px; text-align: center; }
    #lobby h3 { margin: 0 0 4px; color: #ffd166; font-size: 18px; }
    #lobby p { margin: 4px 0; color: #cdb8a0; font-size: 14px; line-height: 1.3; }
    #lobby .sub { text-align: center; }
    #lobby label { display: block; margin: 8px 0 3px; color: #e8cf86; font-size: 15px; }
    #lobby input { width: 100%; box-sizing: border-box; font: inherit; font-size: 20px; padding: 6px 10px; border-radius: 6px;
      border: 2px solid #8a6a3a; background: #2e2219; color: #fffdf2; outline: none; }
    #lobby input:focus { border-color: #ffd166; }
    #lobby input.code { text-transform: uppercase; letter-spacing: 6px; text-align: center; }
    #lobby select { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 5px 6px; margin-top: 6px; border-radius: 6px;
      border: 2px solid #8a6a3a; background: #2e2219; color: #fffdf2; outline: none; }
    #lobby select:focus { border-color: #ffd166; }
    #lobby .cols { display: flex; gap: 14px; margin-top: 10px; }
    #lobby .col { flex: 1; background: #2b1f17; border: 1px solid #6a5034; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; }
    #lobby .col button { margin-top: auto; }
    #lobby button { font: inherit; font-size: 19px; padding: 8px 12px; margin-top: 8px; width: 100%; border-radius: 8px; cursor: pointer;
      border: 2px solid #d9a94e; background: #5a4024; color: #fffdf2; }
    #lobby button:hover { background: #6e4e2c; }
    #lobby button.alt { background: #2e2219; }
    #lobby button:disabled { opacity: 0.5; cursor: wait; }
    #lobby .status { min-height: 20px; margin-top: 8px; text-align: center; color: #ffd166; }
    #lobby .status.err { color: #ff8a7a; }
    #lobby .tiny { font-size: 12px; color: #8a7a6a; text-align: center; }
    @media (max-height: 470px) {   /* phones in landscape */
      #lobby .card { padding: 8px 14px; }
      #lobby h2 { font-size: 20px; }
      #lobby .sub, #lobby .tiny, #lobby #lb-hostinfo { display: none; }
      #lobby label { margin: 4px 0 2px; }
      #lobby input { font-size: 17px; padding: 4px 8px; }
      #lobby .cols { margin-top: 6px; }
      #lobby .col { padding: 6px 8px; }
      #lobby button { font-size: 16px; padding: 6px 10px; margin-top: 6px; }
      #lobby .status { margin-top: 4px; min-height: 16px; }
    }
  </style>
