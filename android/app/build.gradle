import javax.inject.Inject

plugins {
    id 'com.android.application'
}

// Release signing comes from android/keystore.properties (kept out of git). Without it, the debug key is used.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.syazwi.littlecreature'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.syazwi.littlecreature'
        minSdk 24
        targetSdk 35
        versionCode 89
        versionName '3.24.0'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        developer {
            initWith release
            applicationIdSuffix '.developer'
            versionNameSuffix '-dev'
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// ------------------------------------------------------------------------------------------
// The game itself lives in the repository root (index.html, src/, lib/ ...). Copy it into the
// APK's assets/www at build time, so the web version and the Android version never drift apart.
abstract class SyncWebAssets extends DefaultTask {
    @Input
    abstract Property<Boolean> getDeveloper()

    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getWebFiles()

    @Internal
    abstract DirectoryProperty getWebRoot()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void sync() {
        fs.sync { spec ->
            spec.from(webRoot) {
                it.include('index.html', 'src/**', 'lib/**', 'icons/**')
                if (!developer.get()) it.exclude('src/dev-*.js')
            }
            spec.into(outputDir.dir('www'))
        }
        if (developer.get()) {
            def index = outputDir.file('www/index.html').get().asFile
            def page = index.getText('UTF-8')
            def main = '<script src="src/main.js"></script>'
            if (!page.contains(main)) throw new GradleException('Could not find the game entry script in index.html')
            def scripts = ['dev-story', 'dev-autoplay', 'dev-routes-early', 'dev-routes-late', 'dev-tools']
                .collect { name -> "<script src=\"src/${name}.js\"></script>" }
            def entry = ['<script>LC.DEV_ANDROID = true;</script>'] + scripts + [main]
            index.setText(page.replace(main, entry.join('\n  ')), 'UTF-8')
        }
    }
}

def webRootDir = rootProject.layout.projectDirectory.dir('..')
def registerWebAssets = { String name, boolean dev ->
    tasks.register(name, SyncWebAssets) {
        developer.set(dev)
        webRoot.set(webRootDir)
        webFiles.from(fileTree(webRootDir) {
            include 'index.html', 'src/**', 'lib/**', 'icons/**'
            if (!dev) exclude 'src/dev-*.js'
        })
        outputDir.set(layout.buildDirectory.dir(dev ? 'generated/developerWebAssets' : 'generated/webAssets'))
    }
}
def syncWeb = registerWebAssets('syncWebAssets', false)
def syncDeveloperWeb = registerWebAssets('syncDeveloperWebAssets', true)

androidComponents {
    onVariants(selector().all()) { variant ->
        def assets = variant.buildType == 'developer' ? syncDeveloperWeb : syncWeb
        variant.sources.assets.addGeneratedSourceDirectory(assets, { it.outputDir })
    }
}
