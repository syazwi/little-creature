import javax.inject.Inject

plugins {
    id 'com.android.application'
}

// Release signing comes from android/keystore.properties (kept out of git). Without it, the debug key is used.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.syazwi.littlecreature'
    compileSdk 36   // (v3.34: Google Play asks new apps to target Android 16, API 36)
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.syazwi.littlecreature'
        minSdk 24
        targetSdk 36
        versionCode 108
        versionName '3.36.0'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        developer {
            initWith release
            applicationIdSuffix '.developer'
            versionNameSuffix '-dev'
            matchingFallbacks = ['release']
        }
        // v3.34: the app bundle for Google Play (.\tools\build.ps1 -Play). The same app as the GitHub APK, signed
        // with the same key (your upload key on Play), but its game files load src/store-play.js: no GitHub updater.
        play {
            initWith release
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// ------------------------------------------------------------------------------------------
// The game itself lives in the repository root (index.html, src/, lib/ ...). Copy it into the
// APK's assets/www at build time, so the web version and the Android version never drift apart.
// mode: 'release' (the GitHub APK), 'developer' (chapter jumps and autoplay) or 'play' (the Google Play bundle).
abstract class SyncWebAssets extends DefaultTask {
    @Input
    abstract Property<String> getMode()

    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getWebFiles()

    @Internal
    abstract DirectoryProperty getWebRoot()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void sync() {
        def m = mode.get()
        fs.sync { spec ->
            spec.from(webRoot) {
                it.include('index.html', 'src/**', 'lib/**', 'icons/**')
                if (m != 'developer') it.exclude('src/dev-*.js')
                if (m != 'play') it.exclude('src/store-*.js')
            }
            spec.into(outputDir.dir('www'))
        }
        if (m == 'release') return
        def index = outputDir.file('www/index.html').get().asFile
        def page = index.getText('UTF-8')
        def main = '<script src="src/main.js"></script>'
        if (!page.contains(main)) throw new GradleException('Could not find the game entry script in index.html')
        def entry
        if (m == 'developer') {
            def scripts = ['dev-story', 'dev-autoplay', 'dev-routes-early', 'dev-routes-late', 'dev-tools']
                .collect { name -> "<script src=\"src/${name}.js\"></script>" }
            entry = ['<script>LC.DEV_ANDROID = true;</script>'] + scripts + [main]
        } else {
            entry = ['<script src="src/store-play.js"></script>', main]
        }
        index.setText(page.replace(main, entry.join('\n  ')), 'UTF-8')
    }
}

def webRootDir = rootProject.layout.projectDirectory.dir('..')
def registerWebAssets = { String name, String kind ->
    tasks.register(name, SyncWebAssets) {
        mode.set(kind)
        webRoot.set(webRootDir)
        webFiles.from(fileTree(webRootDir) {
            include 'index.html', 'src/**', 'lib/**', 'icons/**'
            if (kind != 'developer') exclude 'src/dev-*.js'
            if (kind != 'play') exclude 'src/store-*.js'
        })
        outputDir.set(layout.buildDirectory.dir('generated/' + kind + 'WebAssets'))
    }
}
def syncWeb = registerWebAssets('syncWebAssets', 'release')
def syncDeveloperWeb = registerWebAssets('syncDeveloperWebAssets', 'developer')
def syncPlayWeb = registerWebAssets('syncPlayWebAssets', 'play')

androidComponents {
    onVariants(selector().all()) { variant ->
        def assets = variant.buildType == 'developer' ? syncDeveloperWeb : variant.buildType == 'play' ? syncPlayWeb : syncWeb
        variant.sources.assets.addGeneratedSourceDirectory(assets, { it.outputDir })
    }
}
